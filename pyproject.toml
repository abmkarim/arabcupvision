[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arabcupvision"
version = "0.1.0"
description = "Analyse vidéo de matchs de football : détection, suivi, équipes, homographie et statistiques par joueur."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.3",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "streamlit>=1.36",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "lap>=0.5.12",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
train = ["roboflow>=1.1"]
eval = ["motmetrics>=1.4"]
dev = ["pytest>=8.0", "ruff>=0.5", "detect-secrets>=1.5"]

[project.scripts]
arabcupvision = "arabcupvision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["training/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
