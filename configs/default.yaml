# Configuration unique d'ArabCupVision. Les chemins relatifs partent de la racine du projet.
seed: 42

video:
  frame_skip: 1          # traiter une image sur N
  max_seconds: 0         # 0 = toute la vidéo
  resize_width: 1280     # largeur de travail (0 = native)

detection:
  model_path: models/detector.pt   # YOLOv8 fine-tuné (classes ball/goalkeeper/player/referee)
  fallback_model: yolov8n.pt       # repli COCO (person, sports ball)
  confidence: 0.25
  ball_confidence: 0.10
  iou: 0.5
  imgsz: 960
  device: cpu

tracking:
  tracker: bytetrack.yaml          # ou botsort.yaml
  smoothing_window: 5
  ball_max_gap: 15
  min_track_length: 3

teams:
  fit_frames: 30
  crop_top: 0.15
  crop_bottom: 0.50
  crop_side: 0.25
  green_hue_range: [35, 85]
  green_min_saturation: 40
  min_pixels: 20
  outlier_factor: 2.5
  min_outlier_distance: 25.0

pitch:
  length_m: 105.0
  width_m: 68.0
  keypoint_model_path: models/pitch_keypoints.pt
  keypoint_confidence: 0.5
  min_keypoints: 4
  recompute_interval: 5
  ransac_threshold_m: 1.0
  keypoints_m:            # indices du dataset football-field-detection (Roboflow)
    - [0, 0]   # 0
    - [0, 13.84]   # 1
    - [0, 24.84]   # 2
    - [0, 43.16]   # 3
    - [0, 54.16]   # 4
    - [0, 68]   # 5
    - [5.5, 24.84]   # 6
    - [5.5, 43.16]   # 7
    - [11, 34]   # 8
    - [16.5, 13.84]   # 9
    - [16.5, 26.69]   # 10
    - [16.5, 41.31]   # 11
    - [16.5, 54.16]   # 12
    - [52.5, 0]   # 13
    - [52.5, 24.85]   # 14
    - [52.5, 43.15]   # 15
    - [52.5, 68]   # 16
    - [88.5, 13.84]   # 17
    - [88.5, 26.69]   # 18
    - [88.5, 41.31]   # 19
    - [88.5, 54.16]   # 20
    - [94, 34]   # 21
    - [99.5, 24.84]   # 22
    - [99.5, 43.16]   # 23
    - [105, 0]   # 24
    - [105, 13.84]   # 25
    - [105, 24.84]   # 26
    - [105, 43.16]   # 27
    - [105, 54.16]   # 28
    - [105, 68]   # 29
    - [43.35, 34]   # 30
    - [61.65, 34]   # 31

analytics:
  max_speed_kmh: 40.0
  speed_window: 5
  heatmap_bins: [42, 27]
  heatmap_sigma: 1.5
  heatmap_min_frames: 10
  possession_max_distance_m: 3.0

render:
  minimap: true
  minimap_width: 360
  minimap_alpha: 0.85
  team_colors_bgr: [[60, 60, 230], [230, 160, 40]]
  referee_color_bgr: [0, 215, 255]
  unknown_color_bgr: [180, 180, 180]
  ball_color_bgr: [255, 255, 255]
  h264: true

output:
  root: outputs
